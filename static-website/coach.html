<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask the Coach - RiftRewind</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>RiftRewind</h1>
            <p class="subtitle">AI Coaching</p>
            <nav class="header-nav">
                <a href="index.html" class="nav-link">&larr; Performance Tracker</a>
            </nav>
            <div class="hextech-divider" aria-hidden="true">
                <span class="hd-line"></span>
                <svg class="hd-gem" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 2 L38 20 L20 38 L2 20 Z" fill="none" stroke="#C89B3C" stroke-width="2"/>
                    <path d="M20 11 L29 20 L20 29 L11 20 Z" fill="#0397AB" opacity="0.65"/>
                    <circle cx="20" cy="20" r="2.4" fill="#F0E6D2"/>
                </svg>
                <span class="hd-line"></span>
            </div>
        </header>

        <main>
            <div class="form-container">
                <h2>Ask the Coach</h2>
                <p class="coach-intro">
                    Get grounded coaching advice based on your recent matches and
                    current patch data.
                </p>
                <form id="coach-form">
                    <div class="form-group">
                        <label for="query">Your Question</label>
                        <textarea
                            id="query"
                            name="query"
                            rows="3"
                            placeholder="e.g. How can I improve my mid lane play?"
                            required
                        ></textarea>
                    </div>

                    <button type="submit" class="btn-primary" id="submit-btn">
                        Ask
                    </button>
                </form>

                <div id="loading" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Thinking through your matches...</p>
                </div>

                <div id="error-message" class="error-message" style="display: none;"></div>
            </div>

            <div id="answer-section" class="answer-section" style="display: none;">
                <h3>Coach's Answer</h3>
                <div id="answer-text" class="answer-text"></div>
                <div id="sources" class="sources"></div>
            </div>
        </main>

        <footer>
            <p>&copy; 2025 RiftRewind. Not endorsed by Riot Games.</p>
        </footer>
    </div>

    <script src="js/config.js"></script>

    <script>
        const form = document.getElementById('coach-form');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');
        const answerSection = document.getElementById('answer-section');
        const answerText = document.getElementById('answer-text');
        const sources = document.getElementById('sources');

        if (API_CONFIG.API_ENDPOINT === 'YOUR_API_GATEWAY_URL_HERE') {
            showError('⚠️ API not configured. Please update js/config.js with your API Gateway URL.');
            submitBtn.disabled = true;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const query = document.getElementById('query').value.trim();
            if (!query) {
                showError('Please enter a question.');
                return;
            }

            loading.style.display = 'block';
            errorMessage.style.display = 'none';
            answerSection.style.display = 'none';
            submitBtn.disabled = true;

            try {
                const data = await callAPI('/api/coach', 'POST', { query });

                if (!data.success) {
                    throw new Error(data.error || 'Coaching request failed');
                }

                answerText.textContent = data.answer;

                sources.innerHTML = '';
                if (Array.isArray(data.sources) && data.sources.length > 0) {
                    const heading = document.createElement('h4');
                    heading.textContent = 'Sources';
                    sources.appendChild(heading);
                    const list = document.createElement('ul');
                    data.sources.forEach((s) => {
                        const li = document.createElement('li');
                        li.textContent = typeof s === 'string' ? s : (s.title || s.id || JSON.stringify(s));
                        list.appendChild(li);
                    });
                    sources.appendChild(list);
                }

                answerSection.style.display = 'block';
            } catch (error) {
                console.error('Error:', error);
                showError(error.message);
            } finally {
                loading.style.display = 'none';
                submitBtn.disabled = false;
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }
    </script>

    <svg class="poro-mascot" viewBox="0 0 120 116" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Poro">
        <title>Poro!</title>
        <ellipse cx="60" cy="106" rx="32" ry="6" fill="rgba(0,0,0,0.35)"/>
        <path d="M44 30 C40 14 47 8 51 14 C54 22 51 31 49 35 Z" fill="#D8B15A"/>
        <path d="M76 30 C80 14 73 8 69 14 C66 22 69 31 71 35 Z" fill="#D8B15A"/>
        <path d="M60 16 C28 16 16 42 16 64 C16 88 35 102 60 102 C85 102 104 88 104 64 C104 42 92 16 60 16 Z" fill="#F6F1E3"/>
        <path d="M42 24 Q60 6 78 24" fill="none" stroke="#E7DEC7" stroke-width="7" stroke-linecap="round"/>
        <circle cx="46" cy="62" r="6.5" fill="#23252B"/>
        <circle cx="74" cy="62" r="6.5" fill="#23252B"/>
        <circle cx="48" cy="60" r="2" fill="#fff"/>
        <circle cx="76" cy="60" r="2" fill="#fff"/>
        <circle cx="34" cy="74" r="5" fill="#F3C0B0" opacity="0.7"/>
        <circle cx="86" cy="74" r="5" fill="#F3C0B0" opacity="0.7"/>
        <path d="M55 72 h10 l-5 6 Z" fill="#D76B7A"/>
        <path d="M56 79 q4 6 8 0 Z" fill="#E8889A"/>
    </svg>
</body>
</html>
